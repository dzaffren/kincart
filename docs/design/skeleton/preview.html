<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton /status preview</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: Canvas;
    color: CanvasText;
  }
  .sheet-title { font-size: 14px; margin: 0 0 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 14px; margin-bottom: 8px; max-width: 390px; }
  .phone { width: 390px; border: 1px solid GrayText; }

  /* The page itself. Everything below is what /status renders. */
  .status { padding: 24px 16px; }
  .status h1 { font-size: 20px; line-height: 1.3; font-weight: 600; margin: 0 0 24px; }
  .status dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; align-items: baseline; font-size: 18px; }
  .status dt { font-size: 16px; }
  .status dd { margin: 0; overflow-wrap: anywhere; }
  .status dd.fail { font-weight: 700; }
  .status code { font: 16px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<p class="sheet-title">/status, every state, at 390 px. Light or dark follows your system setting.</p>

<div class="grid">

<figure>
  <figcaption>Scenario 1: both rails up</figcaption>
  <div class="phone"><main class="status">
    <h1>Shop-together status</h1>
    <dl>
      <dt>Database</dt><dd>OK, check #42 at 14:03 UTC</dd>
      <dt>PayPal sandbox</dt><dd>connected</dd>
      <dt>Build</dt><dd><code>a1b2c3d</code></dd>
    </dl>
  </main></div>
</figure>

<figure>
  <figcaption>Scenario 2: after one reload</figcaption>
  <div class="phone"><main class="status">
    <h1>Shop-together status</h1>
    <dl>
      <dt>Database</dt><dd>OK, check #43 at 14:04 UTC</dd>
      <dt>PayPal sandbox</dt><dd>connected</dd>
      <dt>Build</dt><dd><code>a1b2c3d</code></dd>
    </dl>
  </main></div>
</figure>

<figure>
  <figcaption>Scenario 3: database refuses connections</figcaption>
  <div class="phone"><main class="status">
    <h1>Shop-together status</h1>
    <dl>
      <dt>Database</dt><dd class="fail">not reachable</dd>
      <dt>PayPal sandbox</dt><dd>connected</dd>
      <dt>Build</dt><dd><code>a1b2c3d</code></dd>
    </dl>
  </main></div>
</figure>

<figure>
  <figcaption>Scenario 4: PAYPAL_CLIENT_SECRET not set</figcaption>
  <div class="phone"><main class="status">
    <h1>Shop-together status</h1>
    <dl>
      <dt>Database</dt><dd>OK, check #44 at 14:06 UTC</dd>
      <dt>PayPal sandbox</dt><dd class="fail">not configured</dd>
      <dt>Build</dt><dd><code>a1b2c3d</code></dd>
    </dl>
  </main></div>
</figure>

<figure>
  <figcaption>Scenario 4: PayPal answers 401 to the keys</figcaption>
  <div class="phone"><main class="status">
    <h1>Shop-together status</h1>
    <dl>
      <dt>Database</dt><dd>OK, check #45 at 14:07 UTC</dd>
      <dt>PayPal sandbox</dt><dd class="fail">keys rejected</dd>
      <dt>Build</dt><dd><code>a1b2c3d</code></dd>
    </dl>
  </main></div>
</figure>

<figure>
  <figcaption>Extra: PayPal times out or answers 5xx</figcaption>
  <div class="phone"><main class="status">
    <h1>Shop-together status</h1>
    <dl>
      <dt>Database</dt><dd>OK, check #46 at 14:08 UTC</dd>
      <dt>PayPal sandbox</dt><dd class="fail">not reachable</dd>
      <dt>Build</dt><dd><code>a1b2c3d</code></dd>
    </dl>
  </main></div>
</figure>

<figure>
  <figcaption>Extra: DATABASE_URL not set, running locally</figcaption>
  <div class="phone"><main class="status">
    <h1>Shop-together status</h1>
    <dl>
      <dt>Database</dt><dd class="fail">not configured</dd>
      <dt>PayPal sandbox</dt><dd>connected</dd>
      <dt>Build</dt><dd><code>local</code></dd>
    </dl>
  </main></div>
</figure>

</div>
</body>
</html>
